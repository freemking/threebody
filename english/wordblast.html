<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词填空 - English Word Adventure</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/wordblast.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">
</head>
<body>
    <!-- Game Setup Page -->
    <div id="game-setup" class="ui-screen">
        <div class="game-header">
            <a href="index.html" id="btn-back-setup-top" class="back-btn">← 返回</a>
            <div class="game-title">单词填空</div>
        </div>
        <div class="setup-header">
            <h2>单词填空</h2>
            <p class="setup-subtitle">Fill in the missing letters!</p>
        </div>
        
        <div class="setup-content">
            <!-- Grade Selection -->
            <div class="setup-section">
                <h3 class="section-title">📚 Select Grade</h3>
                <div class="grade-path">
                    <div class="grade-grid">
                        <button class="grade-btn" data-grade="1">Grade 1</button>
                        <button class="grade-btn" data-grade="2">Grade 2</button>
                        <button class="grade-btn" data-grade="3">Grade 3</button>
                        <button class="grade-btn" data-grade="4">Grade 4</button>
                        <button class="grade-btn" data-grade="5">Grade 5</button>
                        <button class="grade-btn" data-grade="6">Grade 6</button>
                        <button class="grade-btn" data-grade="7">Grade 7</button>
                        <button class="grade-btn" data-grade="8">Grade 8</button>
                        <button class="grade-btn" data-grade="9">Grade 9</button>
                        <button class="grade-btn" data-grade="all">All Grades</button>
                    </div>
                </div>
            </div>
            
            <!-- Unit Selection -->
            <div class="setup-section" id="unit-section">
                <h3 class="section-title">📖 Select Unit</h3>
                <div class="unit-grid" id="unit-grid">
                    <button class="unit-btn active" data-unit="all">All Units</button>
                </div>
            </div>
            
            <!-- Game Mode -->
            <div class="setup-section">
                <h3 class="section-title">🎮 Game Mode</h3>
                <div class="game-mode-selector">
                    <button class="game-mode-card active" data-mode="classic">
                        <span class="mode-icon">✏️</span>
                        <span class="mode-name">Classic</span>
                        <span class="mode-desc">Fill in the blanks</span>
                    </button>
                    <button class="game-mode-card" data-mode="speed">
                        <span class="mode-icon">⚡</span>
                        <span class="mode-name">Speed</span>
                        <span class="mode-desc">Time challenge</span>
                    </button>
                </div>
            </div>
            
            <!-- Start Button -->
            <div class="setup-section">
                <button id="btn-start-game" class="start-game-btn">
                    <span class="btn-icon">🚀</span>
                    <span>Start Game</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="ui-screen hidden">
        <div class="game-header">
            <a href="index.html" id="btn-back" class="back-btn">← Back</a>
            <div class="game-title">Word Blast</div>
        </div>
        <div id="game-canvas-container">
            <!-- Game canvas will be created here -->
        </div>
        <div class="game-controls">
            <!-- Game specific controls -->
        </div>
    </div>

    <script src="../auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/wordblast.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
